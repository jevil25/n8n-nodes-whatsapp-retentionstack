# Publishes to npm with a provenance statement, which n8n requires for node
# verification (mandatory since 1 May 2026).
#
# Uses npm trusted publishing (OIDC) — no NPM_TOKEN secret needed.
# One-time setup on npmjs.com: package → Settings → Trusted Publisher →
#   Publisher: GitHub Actions
#   Organization/user: jevil25
#   Repository:        n8n-nodes-whatsapp-retentionstack
#   Workflow filename: publish.yml
#
# Provenance requires the GitHub repository to be PUBLIC. Publishing from a
# private repo fails with "Unsupported GitHub Actions source repository visibility".
#
# To release: bump the version, then push a matching tag.
#   npm version patch && git push --follow-tags
name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for provenance + trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # npm 12+ dropped Node 20; keep this >= npm's engine range
          # No registry-url on purpose: it writes an .npmrc expecting NODE_AUTH_TOKEN,
          # and an empty token there can shadow OIDC. registry.npmjs.org is the default.

      # Node 22 ships npm 10; trusted publishing needs >= 11.5.1
      - run: npm install -g npm@latest

      - run: npm ci

      # build + smoke test; publishing a broken node is worse than not publishing
      - run: npm test

      - name: Fail if tag does not match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p 'require("./package.json").version')"
          [ "$TAG" = "$PKG" ] || { echo "tag v$TAG != package.json $PKG"; exit 1; }

      # Prints the identity npm matches against the Trusted Publisher config.
      # Claims only, never the token itself. Delete once publishing works.
      - name: Show OIDC claims npm will match on
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).value')
          node -e '
            const c = JSON.parse(Buffer.from(process.argv[1].split(".")[1], "base64url").toString());
            console.log("repository      :", c.repository);
            console.log("workflow_ref    :", c.workflow_ref);
            console.log("environment     :", c.environment ?? "(none)");
            console.log("→ npm expects Organization/user =", (c.repository||"/").split("/")[0]);
            console.log("→ npm expects Repository        =", (c.repository||"/").split("/")[1]);
            console.log("→ npm expects Workflow filename =", (c.workflow_ref||"").split("/").pop().split("@")[0]);
          ' "$TOKEN"

      # Fallback: if trusted publishing (OIDC) is not configured on npmjs.com,
      # add an NPM_TOKEN repo secret (granular access token, "Read and write"
      # for this package). Provenance still works — it needs id-token + a public
      # repo, not trusted publishing. Remove this once OIDC works.
      - name: Use NPM_TOKEN if present
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - run: npm publish --provenance --access public
