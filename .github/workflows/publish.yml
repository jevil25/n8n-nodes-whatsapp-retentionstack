# Publishes to npm with a provenance statement, which n8n requires for node
# verification (mandatory since 1 May 2026).
#
# Uses npm trusted publishing (OIDC) — no NPM_TOKEN secret needed.
# One-time setup on npmjs.com: package → Settings → Trusted Publisher →
#   Publisher: GitHub Actions
#   Organization/user: jevil25
#   Repository:        n8n-nodes-whatsapp-retentionstack
#   Workflow filename: publish.yml
#
# Provenance requires the GitHub repository to be PUBLIC. Publishing from a
# private repo fails with "Unsupported GitHub Actions source repository visibility".
#
# To release: bump the version, then push a matching tag.
#   npm version patch && git push --follow-tags
name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for provenance + trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # npm 12+ dropped Node 20; keep this >= npm's engine range
          # No registry-url on purpose: it writes an .npmrc expecting NODE_AUTH_TOKEN,
          # and an empty token there can shadow OIDC. registry.npmjs.org is the default.

      # Node 22 ships npm 10; trusted publishing needs >= 11.5.1
      - run: npm install -g npm@latest

      - run: npm ci

      # build + smoke test; publishing a broken node is worse than not publishing
      - run: npm test

      - name: Fail if tag does not match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p 'require("./package.json").version')"
          [ "$TAG" = "$PKG" ] || { echo "tag v$TAG != package.json $PKG"; exit 1; }

      - run: npm publish --provenance --access public
